name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 25.8.1
          cache: npm
      - run: npm ci
      - name: Run tests
        run: |
          export CHROME_PATH="$(command -v google-chrome)"
          test -x "$CHROME_PATH"
          npm test
